[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghtriage"
version = "0.2.0"
description = "Reusable template for production-style ML projects on a zero-cost stack"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=16",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "joblib>=1.4",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Full MLflow (not mlflow-skinny): the SQLite tracking store needs SQLAlchemy and Alembic.
# Kept out of the core dependencies so the serving image stays small.
train = ["mlflow>=3.0", "lightgbm>=4.3"]
explain = ["shap>=0.46", "matplotlib>=3.8"]
# pandas 3.1.0 (2026-10-22) removed an internal that Evidently 0.7.23 imports; lift the cap
# once an Evidently release supports pandas 3.1.
monitor = ["evidently>=0.7", "pandas<3.1"]
dev = ["ghtriage[train,explain,monitor]", "pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
